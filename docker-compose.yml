services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas_ai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_ai"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/saas_ai
      REDIS_URL: redis://redis:6379/0
      LLM_MODE: fake
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PYTHONPATH: /app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/saas_ai
      REDIS_URL: redis://redis:6379/0
      LLM_MODE: fake
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PYTHONPATH: /app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "backend.app.worker"]

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/saas_ai
      REDIS_URL: redis://redis:6379/0
      LLM_MODE: fake
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PYTHONPATH: /app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "backend.app.scheduler.main"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"

  automation-runner:
    build:
      context: .
      dockerfile: automation-runner/Dockerfile
    environment:
      ARTIFACTS_ROOT: /artifacts
    volumes:
      - automation_artifacts:/artifacts
    expose:
      - "3000"

  backend-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/saas_ai
      REDIS_URL: redis://redis:6379/0
      LLM_MODE: fake
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      GOOGLE_CLIENT_ID: test-client
      GOOGLE_CLIENT_SECRET: test-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/integrations/google/callback
      SLACK_CLIENT_ID: slack-client
      SLACK_CLIENT_SECRET: slack-secret
      SLACK_REDIRECT_URI: http://localhost:8000/integrations/slack/callback
      SLACK_SCOPES: channels:read,groups:read,chat:write,users:read.email
      JIRA_CLIENT_ID: jira-client
      JIRA_CLIENT_SECRET: jira-secret
      JIRA_REDIRECT_URI: http://localhost:8000/integrations/jira/callback
      JIRA_SCOPES: read:jira-work,write:jira-work,read:jira-user,offline_access
      NOTION_CLIENT_ID: notion-client
      NOTION_CLIENT_SECRET: notion-secret
      NOTION_REDIRECT_URI: http://localhost:8000/integrations/notion/callback
      MICROSOFT_CLIENT_ID: ms-client
      MICROSOFT_CLIENT_SECRET: ms-secret
      MICROSOFT_REDIRECT_URI: http://localhost:8000/integrations/microsoft/callback
      MICROSOFT_SCOPES: offline_access User.Read Mail.Read Mail.Send Calendars.ReadWrite
      PYTHONPATH: /app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "pytest", "backend/tests", "-q"]

volumes:
  automation_artifacts:
